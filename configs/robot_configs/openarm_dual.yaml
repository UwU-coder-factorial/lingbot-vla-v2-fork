states:
  - observation.state.arm.position:
      origin_keys:
        - observation.qpos:
            start: 0
            end: 7
        - observation.qpos:
            start: 8
            end: 15

  - observation.state.effector.position:
      origin_keys:
        - observation.qpos:
            start: 7
            end: 8
        - observation.qpos:
            start: 15
            end: 16

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 7
        - action:
            start: 8
            end: 15
      subtract_state: true

  - action.effector.position:
      origin_keys:
        - action:
            start: 7
            end: 8
        - action:
            start: 15
            end: 16
      subtract_state: false

images:
  - observation.images.chest_rgb:
      origin_keys: observation.images.chest_rgb

# Optional depth camera mapping (uncomment when enabling depth training)
# depth_images:
#   - observation.images.chest_depth:
#       origin_keys: observation.images.chest_depth

norm_stats: assets/norm_stats/openarm_dual.json

